version: 2

goal:
  title: "yuku-tsrx production toolchain"
  slug: "yuku-tsrx"
  kind: existing_plan
  tranche: "Execute M0 through M5 continuously until the complete nine-item owner oracle is proven."
  status: active
  oracle:
    signal: "Current command-backed evidence proves all nine Goal Oracle items in the root goal.md."
    cadence: "after each milestone Worker package and at final audit"
    final_proof: "A final Judge or PM receipt maps all nine oracle items to current passing commands, generated artifacts, measurements, and the read-only Markless drop-in result, with full_outcome_complete: true."
  intake:
    original_request: "Follow goal.md"
    interpreted_outcome: "Deliver a production Zig TSRX parser, analyzer, code generator, and generated TypeScript surface as a zero-cost compile-time dialect adapter over Yuku."
    input_shape: existing_plan
    audience: "Markless, Frameless, Versionless, and Guessless consumers"
    authority: requested
    proof_type: test
    completion_proof: "All nine root-charter oracle items pass with recorded command output; the Yuku seam is minimal and PR-ready but is not published without separate approval."
    likely_misfire: "Calling a scaffold, parser-only implementation, fixture-only pass, fork, parallel parser, text projection, or hand-written decoder complete."
    blind_spots_considered:
      - "The intake's Yuku commit identities and tool versions may have changed and must be revalidated."
      - "Cross-repository writes are limited to yuku-tsrx and the linked Yuku checkout; downstream consumers remain read-only."
      - "The Markless drop-in proof must run from a copy or temporary workspace."
      - "Opening the final upstream PR requires separate explicit authority."
    existing_plan_facts:
      - "Owner rulings require no fork and local path-link first, upstream PR last."
      - "M0 links, scaffolds, verifies both toolchains, and records performance and binary controls."
      - "M1 extracts a comptime dialect seam and resolves dialect node representation without TSRX in Yuku."
      - "M2 implements TSRX parsing and the 18-fixture positive and negative acceptance corpus."
      - "M3 extends the generated wire format and TypeScript surface without changing dialect-free output."
      - "M4 provides analyzer and codegen behaviour through the adapter."
      - "M5 proves the unmodified Markless drop-in, measures performance and memory, and prepares the minimal Yuku PR."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/yuku-tsrx/"
    command: "node /Users/jacksm5pro/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.3/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal /Users/jacksm5pro/dev/open-source/yuku-tsrx/docs/goals/yuku-tsrx"

active_task: T100

