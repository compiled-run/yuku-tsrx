      summary: "Repository and toolchain inspection confirms the charter-only root, usable Yuku prior art, exact 18-fixture acceptance corpus, generator/profiler/public-module surfaces, and production parser seams. M0 is not immediately executable against its required control commit: linked Yuku is on feat/tsrx at bf03e146, while upstream/main is eb2adcb4. Zig, Node, and pnpm match requirements; vite-plus is only locally available through consumer workspaces and reports an unexpected bundled Vite version. A root-only scaffold is the largest safe Worker package before PM resolves the Yuku checkout/control-state transition."
