# GoalBuddy v2 state.yaml
version: 2
goal:
  title: "compiled.run website: a neutral repo and Vercel project that owns the domain and its rewrites"
  slug: compiled-run-website
  kind: specific
  tranche: create compiled-run/website (landing + vercel.json rewrites for oxc-tsrx, guessless, yuku-tsrx + COOP/COEP for oxc-tsrx paths + deploy workflow), its own Vercel project, prove all routes on the project URL, move compiled.run to it, verify, then retire the oxc-tsrx-side rewrite PR and flip yuku-tsrx links
  status: done
  oracle:
    signal: "https://compiled.run/ serves the neutral landing from the website project; /oxc-tsrx, /oxc-tsrx/guide/introduction, /oxc-tsrx/playground (crossOriginIsolated true), /guessless, /yuku-tsrx, /yuku-tsrx/guide/introduction, /yuku-tsrx/playground all 200 through rewrites; the domain is attached to the website project, not oxc-tsrx-docs; the repo compiled-run/website exists with the rewrites and a workflow that deploys main to production; oxc-tsrx PR #24 closed as superseded; yuku-tsrx docs and README point at compiled.run/yuku-tsrx."
    cadence: after each Worker package and at final audit
    final_proof: Judge receipt with the route table (before and after cutover), vercel project/domain inspection output, repo URL, workflow run URL, and the yuku-tsrx redeploy id.
  intake:
    original_request: oxc-tsrx should NOT be the one that decides all of our rewrites and what deploys. Make a new compiled.run/website repo that holds all the rewrites and we make PRs to that repo instead. Use fable opus cockpit and a 15m /loop.
    interpreted_outcome: A neutral compiled-run/website repo and Vercel project own compiled.run and its per-project rewrites; products PR rewrite lines there.
    input_shape: specific
    audience: owner and the compiled-run projects
    authority: requested
    proof_type: artifact
    completion_proof: Live compiled.run served by the website project with every route 200 and the domain moved; PRs flow to the new repo.
    likely_misfire: Moving the domain before the rewrites are proven and breaking compiled.run/oxc-tsrx (or its wasm playground, which needs cross-origin isolation); or embedding builds instead of proxying, recreating the coupling.
    blind_spots_considered:
      - oxc-tsrx pages need COOP/COEP; the website must set them for /oxc-tsrx paths and the proxy must not strip them (prove crossOriginIsolated on the project URL first)
      - Vercel rewrites to external hosts proxy at the edge; assets under each product's base path must resolve through the proxy
      - oxc-tsrx's own landing and guessless embed become dead after cutover; a cleanup PR there is the owner's call
      - "the domain move is outward-facing: sequence is deploy, prove, then alias"
    existing_plan_facts:
      - "Repo: github.com/compiled-run/website (public)."
      - "Vercel project: compiled-run-website in scope jack-shelton; production from main."
      - "Rewrites: /oxc-tsrx(/:path*) -> https://oxc-tsrx-docs.vercel.app/oxc-tsrx..., /guessless(/:path*) -> https://guessless-docs.vercel.app/guessless..., /yuku-tsrx(/:path*) -> https://yuku-tsrx-docs.vercel.app/yuku-tsrx...."
      - "Execution: PM composes fable-opus packets; workers write the new repo via Bash because the scope guard only allows Edit/Write under this checkout."
rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true
agents:
  scout: installed
  worker: installed
  judge: installed
