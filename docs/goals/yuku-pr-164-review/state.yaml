r zero."
  status: done # TRANCHE 5 (owner go 2026-08-14: 'go ahead and fix the issues then in yuku-tsrx... make subagents and parallelize the work' — breaker latch cleared): close the yuku-tsrx feature gap vs @tsrx/core
  oracle:
    signal: "A final review report in notes/ where every finding cites specific PR #164 diff hunks and corroborating files in the local yuku clone, and whose coverage spans the entire PR diff."
    cadence: "after each review packet and at final audit"
    final_proof: "Judge audit receipt confirming full-diff coverage, evidence-backed findings, and no GitHub posting without explicit user approval; full_outcome_complete: true"
  intake:
    original_request: "Do a 15m /loop using goal prep skill with fable opus cockpit. I want you to do a PR review on https://github.com/yuku-toolchain/yuku/pull/164 in relation to the yuku repo"
    interpreted_outcome: "A thorough, repo-grounded code review of yuku PR #164 delivered as a ranked findings report."
    input_shape: audit
    audience: "Jack Shelton (yuku toolchain maintainer)"
    authority: approved # tranche 2: user replied 'Ok then change the PR...' — code changes + push to their own fork PR branch authorized; PR is thejackshelton/yuku (user's), maintainerCanModify true
    proof_type: review
    completion_proof: "Final ranked review report in notes/ covering the whole PR #164 diff, each finding backed by diff-line and repo-file evidence, passed by Judge audit."
    likely_misfire: "Reviewing the raw diff without yuku repo context, drifting into fixing the PR, or posting review comments to GitHub without approval."
    blind_spots_considered:
      - "Delivery target assumed local report only; posting to the GitHub PR requires explicit user approval."
      - "PR size and risk profile unknown until Scout maps the diff."
      - "Review depth: correctness first, then design/perf/tests; style nits deprioritized."
    existing_plan_facts:
      - "User mandated the fable-opus-cockpit for dispatching review work; PM must load that skill and route worker-shaped packets through its packet gate."
      - "Review must be grounded in the yuku repo (local clone at /Users/jacksm5pro/dev/open-source/yuku)."
      - "A 15m /loop (cron job fc1c048f) re-enters this goal; each iteration continues the board, not a fresh prep."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  # installed | bundled_not_installed | missing | unknown
  scout: installed
  worker: installed
  judge: installed

