version: 2

goal:
  title: "Minimal upstream Yuku seam"
  slug: "yuku-minimal-seam"
  kind: recovery
  tranche: "Design and implement one tiny clean-base generic compile-time interception primitive that meets yuku-tsrx needs while preserving Yuku's data-oriented zero-cost philosophy."
  status: done
  oracle:
    signal: "A patch from clean Yuku base 728c16d4 changes at most eleven production source files and adds at most 75 production lines; the paths are exactly nine demonstrated consumers, one existing-Parser public export, and one build-time selector; it introduces exactly one generic compile-time extension type with point-specific calls only at demonstrated current consumers, preserves zero default-path runtime and representation cost, and passes full upstream plus yuku-tsrx/Markless compatibility."
    cadence: "after the Scout map, before writes, after the Worker package, and at final audit"
    final_proof: "A final Judge maps every upstream changed line to a demonstrated yuku-tsrx need, proves forbidden broad seam machinery absent, and records full_outcome_complete: true."
  intake:
    original_request: "Minimal changes needed only NOW. Like make a function public type minimal. Yes very tiny upstream that meets the needs for us and still follows all the yuku philosophy."
    interpreted_outcome: "Replace the closed 2.3k-line Yuku patch with one tiny clean-base generic compile-time extension, preserving Yuku's data-oriented zero-cost design and keeping all TSRX behavior local."
    input_shape: recovery
    audience: "yuku-tsrx, upstream Yuku maintainers, and Markless consumers"
    authority: approved
    proof_type: test
    completion_proof: "Fresh upstream diff within eleven exact production paths/75 added production lines and 150 total changed lines, focused proof embedded in those paths, default-path zero-cost/representation proof, and complete upstream, yuku-tsrx, and Markless verification."
    likely_misfire: "Salvaging the old architecture, recreating a hook framework, or adding runtime/representation cost while calling the result minimal."
    blind_spots_considered:
      - "Current yuku-tsrx may rely on broad seam behavior that must be reimplemented locally."
      - "The authoritative upstream base may differ from the old v0.8.4 base."
      - "A public symbol exposure must not alter ordinary upstream behavior."
      - "The closed branch and PR must remain untouched."
      - "A tiny generic interception point may be required, but must compile away completely for ordinary Yuku."
      - "Node/token/wire layouts and flat indexed/arena-backed representation must not grow or change."
    existing_plan_facts:
      - "Prefer making an existing function or type public."
      - "A genuinely small non-visibility upstream extension is explicitly authorized when visibility alone cannot meet the need."
      - "Upstream production budget is at most three files and 25 added lines."
      - "Complete upstream patch budget is at most four paths and 100 changed lines."
      - "At most one generic compile-time interception primitive; no broad framework or runtime dispatch."
      - "Follow Yuku's flat-index, arena, source-offset, common-case-fast, compile-time-invariant philosophy."
      - "Use a fresh clean-base worktree/branch and do not update the closed PR."
      - "Keep TSRX-specific logic in yuku-tsrx."
      - "Owner explicitly approved proceeding under the proposed 75-added-production-line and 150-total-changed-line ceilings with: That's fine, go do it."
      - "Clean-base scoping then proved that the same line budget distributes across exactly eleven necessary production paths: nine current consumers, src/parser/root.zig for a one-line existing Parser re-export, and build.zig for an empty-default build-time selector; this corrects path accounting without expanding the approved line ceilings."
      - "Exactly one generic compile-time extension type and point-specific calls at only the 19 proven current consumers are authorized."
      - "A specialized-only state channel is authorized only when default Yuku layout, allocation behavior, control flow, optimized machine code, and serialized output remain identical."
      - "On 2026-08-13 the owner explicitly reopened the blocked goal: stop blocking it and make the upstream correction as little LOC as possible. This authorizes only the smallest upstream ordinary-let pre-dispatch correction needed for correctness; it does not authorize broad seam growth or moving TSRX logic upstream."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

