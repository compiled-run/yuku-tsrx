        - "sed build metadata/README; rg Markless consumers and upstream allocation/transfer paths"
        - "sed Markless adapter/type-service/router and upstream AST/parser/transfer excerpts"
        - "read-only Git status checks, host/generated SHA-256 comparison, and hypothesis search"
