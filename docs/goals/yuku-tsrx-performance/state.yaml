  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/yuku-tsrx-performance/"
    command: "node /Users/jacksm5pro/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.3/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal /Users/jacksm5pro/dev/open-source/yuku-tsrx/docs/goals/yuku-tsrx-performance"

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: low
    objective: "Map current end-to-end yuku-tsrx performance and memory costs without changing any repository."
    inputs:
      - "Current yuku-tsrx source, generated npm host, tests, and retained benchmarks"
      - "Read-only current upstream Yuku source and the supplied data-oriented design hypotheses"
      - "Read-only Markless consumer paths"
    constraints:
      - "Read-only."
      - "Do not edit, commit, push, or open PRs in any repository."
      - "Never propose or perform an upstream Yuku change."
    expected_output:
      - "Cost-layer map"
      - "Benchmark and profiling inventory"
      - "Ranked locally owned optimization candidates"
      - "Exact evidence gaps and safe next task candidates"
    receipt:
      result: done
      summary: "Current valid retained corpus evidence shows yuku-tsrx at 0.3116x @tsrx/core parse time but 1.3134x peak RSS. The measured public path includes module startup, UTF-8 encoding, native arena-backed parsing, exact-size ArrayBuffer allocation and wire serialization, native-tree teardown, generated JavaScript validation/materialization, and Markless decoration. No retained evidence attributes RSS among these layers. Highest-confidence local candidates are decoder allocation/retention, source encoding and representation lifetime, then binding/wire lifetime changes; all require isolated attribution before implementation. Existing pair evidence is explicitly noisy, and the supplied data-oriented-design article is not retained as an inspectable input."
      evidence:
        - path: benchmarks/m5-baseline.json
          finding: "Valid oracle8 uses 224 common valid files/214751 bytes, 20 fresh-process samples, and reports yuku/core duration ratio 0.3116448486, throughput-cost ratio 0.3118179521, and peak-RSS ratio 1.3134219485."
        - path: benchmarks/m5-baseline.json
          finding: "Yuku median/p95 peak RSS is 265502720/279117824 bytes versus core 202145792/203702272; both corpus noise summaries pass retained thresholds."
        - path: benchmarks/m5-baseline.json
          finding: "Current oracle4 TSRX-versus-TSX pair campaign is invalid_noisy: 28/32 gates pass; TSX RSS p95 and three feature-duration p95 gates fail."
        - path: benchmarks/m5-measure.ts
          finding: "Harness hashes inputs, freezes options, uses seeded orders, alternates variants serially, launches a fresh child for each sample, measures peak RSS through /usr/bin/time -l, retains raw samples, and applies MAD/p95 gates."
        - path: benchmarks/m5-measure-child.ts
          finding: "Child imports fixed absolute generated-host/core entries; timed corpus work repeatedly calls parseModule after one corpus warmup, so reported RSS remains whole-process peak and is not layer-attributed."
        - path: npm/yuku-tsrx/index.js
          finding: "Public parse(string) performs TextEncoder encoding, native parseWire, sourceText handling, then generated decode; parseModule additionally interprets diagnostics and returns the materialized Program."
        - path: src/ffi/root.zig
          finding: "Native parse uses std.heap.smp_allocator, builds an arena-backed tree, allocates an exact-size N-API ArrayBuffer, serializes the complete tree, then deinitializes the tree."
        - path: npm/yuku-tsrx/decode.js
          finding: "Generated decoder overlays typed views on the wire, validates all sections, may allocate a UTF-8 byte-to-UTF-16 position map, recursively materializes node objects/arrays/strings, and lazily caches program/comments/diagnostics."
        - path: zig-out/npm/yuku-tsrx
          finding: "Generated host contains index 3208 B, binding loader 1845 B, decoder 42769 B, analyzer decoder 49947 B, and encoder 73755 B; checked host JS hashes exactly match npm/yuku-tsrx sources."
        - path: ../markless-yuku-tsrx-migration/packages/compiler/src/yuku-tsrx-adapter.ts
          finding: "Markless always invokes yuku parseModule with collect:true, then maps diagnostics/comments, traverses the complete AST with a visited Set, defines compatibility aliases, and decorates the Program, adding consumer-side allocations after package parsing."
        - path: profiler/profile.zig
          finding: "Retained native profiler measures only dialect-free upstream parse latency using page_allocator; it has no RSS, wire, binding, decoder, package-load, or Markless-retention attribution."
        - path: test
          finding: "Retained gates cover native ArrayBuffer wire/decode/encode, generated artifacts, package/types, parser behavior, analyzer/codegen, strict/loose diagnostics, and Markless compatibility, but no layer-specific memory contract."
      facts:
        - kind: cost_layer_map
          layers: "Node/package startup and loading of index, generated decoders/encoder, binding loader, and native addon,String input UTF-8 encoding; Uint8Array input avoids encoding but sourceText may decode it back to a string,Native arena-backed parse and optional semantic/comment work,Exact-size JS ArrayBuffer allocation plus complete flat-tree wire serialization,Native tree arena teardown after serialization,Generated wire validation, typed-array views, optional non-ASCII position map, strings, arrays, node objects, comments, diagnostics, dialect overlays, and lazy result caches,Caller retention of Program/result/wire/source and Markless full-tree compatibility decoration"
        - kind: benchmark_inventory
          items: "m5-classify: frozen 237-file Markless classification, yielding 224 common-valid and 13 common-invalid files,m5-measure/m5-measure-child: isolated corpus and paired-feature latency/whole-process peak-RSS campaign with retained raw samples,m5-baseline: valid oracle8 historical package comparison plus invalid noisy oracle4 revisions,tsrx-core.ts: older in-process RSS-delta benchmark, unsuitable as the binding baseline,profiler/profile.zig and M1 tooling: native parser timing/profiling controls, not end-to-end memory attribution,m5 tests: protocol/hash/schema/noise-retention guards"
        - kind: ranked_local_candidates
          candidates: "[object Object],[object Object],[object Object],[object Object],[object Object]"
        - kind: evidence_gaps
          gaps: "No fresh frozen baseline for the current checkout/artifacts; retained 0.3116/1.3134 values are prior evidence only.,No staged measurements for startup-only, encode-only, native parse/tree, wire allocation/serialization, decode/materialization, post-return retention, or Markless decoration.,No retained wire-size, node-count, JS heap, external ArrayBuffer, malloc/allocator-retention, or object-allocation samples on the 224-file corpus.,No controls comparing string versus Uint8Array input, parseWire-only versus decode, retained versus discarded results, ASCII versus Unicode, comments, loose mode, or collect behavior.,No proof of when N-API input bytes and returned ArrayBuffer backing storage become collectible.,No inspectable copy or citation of the supplied data-oriented-design article.,No frozen current Git/artifact identities for yuku-tsrx, upstream Yuku checkout, runtime, and Markless corpus in a new campaign."
        - kind: safe_next_task_candidates
          candidates: "Define a fair attribution protocol with fresh-process staged variants: import-only, encode/source-only, parseWire-only, decode-only from frozen wires, parseModule with discard/retain, and Markless-adapter retain.,Freeze current identities and rerun only the valid 224-file corpus baseline with symmetric startup/warmup/options and retained raw samples.,Add read-only heap/external-memory and wire-size attribution controls alongside authoritative OS peak RSS, without treating V8 counters as the oracle.,After attribution, select one reversible local Worker slice from decoder allocations, source representation overlap, wire lifetime, or package loading with exact compatibility gates."
      contradictions:
        - "README.md says implementation status is 'not started', while source, generated npm host, tests, migration consumer, and retained benchmarks are present."
        - "The retained pair campaign has numeric ratios but validity is invalid_noisy and claims are deliberately empty; it cannot support an optimization decision."
        - "The native profiler uses page_allocator and dialect-free controls, whereas production binding uses smp_allocator and the TSRX dialect, so its absolute costs are not production-package costs."
        - "The board names current upstream Yuku, but build.zig.zon currently path-links ../yuku-dialect; both upstream checkouts were inspected read-only and neither may be changed."
      ambiguity_requiring_judge:
