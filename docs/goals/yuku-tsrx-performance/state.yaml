        - "Decide whether package startup belongs in every timed sample or requires a separately reported startup stratum plus warm parse stratum; comparisons must remain symmetric."
        - "Decide the authoritative retention window and whether the public parse result, source string, and wire are retained or discarded at RSS sampling."
        - "Decide whether Markless adapter decoration is an attribution control only or part of the primary end-to-end oracle; Markless remains read-only."
        - "Decide whether the missing supplied article must be requested or whether its generic hypotheses are adequately represented by direct source evidence."
      commands:
