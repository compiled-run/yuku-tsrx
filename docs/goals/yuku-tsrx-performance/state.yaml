version: 2

goal:
  title: "yuku-tsrx end-to-end performance"
  slug: "yuku-tsrx-performance"
  kind: open_ended
  tranche: "Measure the current end-to-end package, identify the dominant owned costs, and complete successive safe verified optimizations until a balanced performance win is proven."
  status: blocked
  oracle:
    signal: "A reproducible same-machine, same-corpus benchmark shows materially lower yuku-tsrx peak RSS than the current baseline while preserving approximately 3x parse-speed advantage over @tsrx/core, with all behavior, wire, package, and Markless compatibility gates green."
    cadence: "after each Worker package and at final audit"
    final_proof: "A final Judge maps retained before/after measurements, attribution evidence, and regression suites to the complete owner outcome with full_outcome_complete: true."
  intake:
    original_request: "Look at performance and memory improvements, but do not make more changes to upstream Yuku."
    interpreted_outcome: "Improve end-to-end yuku-tsrx latency and memory in the locally owned integration without changing expert-owned upstream Yuku."
    input_shape: vague
    audience: "yuku-tsrx and Markless consumers"
    authority: requested
    proof_type: metric
    completion_proof: "Stable same-machine before/after metrics show a balanced real-package win, approximately preserving the current 3x speed advantage while materially reducing peak RSS, with all correctness and consumer gates passing."
    likely_misfire: "Optimizing upstream Yuku, tuning a synthetic microbenchmark, weakening AST/wire behavior, or claiming a win from noisy process-level RSS without layer attribution."
    blind_spots_considered:
      - "The observed RSS delta may come from the Zig tree, native wire buffer, JavaScript decoder, module loading, or the measurement harness rather than parser core."
      - "Peak RSS can be noisy and process-wide, so retained baselines and attribution controls are required before editing."
      - "The current speed advantage is valuable and must not be traded away casually for memory."
    existing_plan_facts:
      - "Use an end-to-end package-performance goal rather than an upstream-parser-only goal."
      - "Upstream Yuku and its checkout are strictly read-only; no further upstream changes are allowed."
      - "Treat the supplied data-oriented design article as hypotheses to validate, not instructions to rewrite Yuku."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

