# GoalBuddy v2 state.yaml
version: 2
goal:
  title: yuku-tsrx docs site and logo, cloned from oxc-tsrx, deployed to Vercel
  slug: yuku-tsrx-docs-site
  kind: specific
  tranche: "continuous execution: scaffold the site from oxc-tsrx, re-skin the logo, write parser/analyzer/codegen content, trim the README, deploy to Vercel production, audit against oxc-tsrx"
  status: active
  oracle:
    signal: A production Vercel URL for yuku-tsrx serves a docs site whose structure, components, and styling match compiled.run/oxc-tsrx, with a re-colored logo bearing the yuku-tsrx wordmark, whose guides cover the parser, analyzer, and codegen (not lint/format), and whose every stated fact is checkable in the yuku-tsrx repo; the local docs build passes; README.md is materially shorter than 143 lines with the same facts.
    cadence: after each Worker package and at final audit
    final_proof: Receipt with the production URL, HTTP 200 on every nav page, screenshots of home + one guide next to the oxc-tsrx equivalents, the local build command and its exit code, README line count before/after, and a Judge audit that no page mentions linting or formatting as a yuku-tsrx feature.
  intake:
    original_request: Make the README way less wording. Copy the oxc-tsrx logo (new color gradient, colors changed a little, yuku-tsrx wordmark) and the oxc-tsrx docs site style and components; focus on parser, analyzer, codegen instead of lint/format; full Vercel deploy. Use goal prep with fable opus cockpit and a 15m /loop.
    interpreted_outcome: yuku-tsrx has a live docs site and logo that look like oxc-tsrx's but are re-colored and re-branded, whose content is about parsing/analysis/codegen, plus a shorter README.
    input_shape: specific
    audience: Developers evaluating or integrating yuku-tsrx (Markless/Frameless authors, Yuku maintainers).
    authority: requested
    proof_type: artifact
    completion_proof: Live production Vercel URL + local build green + README trimmed + Judge visual/content audit passed.
    likely_misfire: Copying oxc-tsrx so faithfully that the site advertises a linter/formatter/editor integration yuku-tsrx does not have, or inventing API/benchmark facts to fill pages; or shipping a docs site that builds locally but the Vercel deploy is a preview, not production; or re-skinning the logo so lightly it is still visually the oxc-tsrx mark.
    blind_spots_considered:
      - oxc-tsrx is served under compiled.run/oxc-tsrx, probably via a rewrite from a compiled.run Vercel project. Whether yuku-tsrx should live at compiled.run/yuku-tsrx or a *.vercel.app URL is an owner call; default is a new Vercel project on *.vercel.app and a receipt noting the domain step.
      - "The docs site should say honestly that the npm package is unpublished and the Yuku seam is PR #164, or the Install page will lie."
      - oxc-tsrx's playground demo runs a wasm engine in-browser; yuku-tsrx has a native addon and no wasm build. The playground page must be dropped or replaced, not copied broken.
      - docs/goals/ already exists inside docs/; the site tooling must not swallow or format those files.
      - No em dashes and no AI attribution anywhere in shipped prose, per owner preference.
    existing_plan_facts:
      - "Copy most of the oxc-tsrx docs site (~/dev/open-source/oxc-tsrx/docs): same build tooling, components, layout, styles."
      - Copy the oxc-tsrx logo generation and change the gradient and colors a little; the wordmark reads yuku-tsrx.
      - "Content focus: parser, analyzer, code generator. Not linting, not formatting."
      - "README: same facts, far fewer words."
      - Deploy to Vercel (production).
      - "Execution: /goal PM dispatches Worker tasks through the fable-opus cockpit (opus-worker packets), under a 15-minute /loop."
rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true
agents:
  scout: installed
  worker: installed
  judge: installed
